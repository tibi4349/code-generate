<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Kód Generátor</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <link rel="stylesheet" href="res/style/main.css">
    <script src="src/main.js"></script>
    <button onclick="downloadBarcode()" style="background: #28a745;">Vonalkód letöltése</button>
    <button onclick="downloadQR()" style="background: #28a745;">QR-kód letöltése</button>

</head>
<body>

    <div class="container">
        <h1>Kód Generátor</h1>
        <input type="text" id="userInput" placeholder="Írj be szöveget vagy számot">
        <br>
        <button onclick="generateCodes()">Generálás</button>

        <div class="output">
            <h3>Vonalkód:</h3>
            <svg id="barcode"></svg>
            
            <h3>QR-kód:</h3>
            <div id="qrcode"></div>
        </div>
    </div>

</body>
</html>
